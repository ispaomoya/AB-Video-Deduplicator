name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python build.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/AB-Video-Processor -DestinationPath AB-Video-Processor-Windows.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: hdiutil create -volname AB-Video-Processor -srcfolder dist/AB-Video-Processor.app -ov -format UDZO AB-Video-Processor-${{ matrix.os }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Video-Processor-${{ matrix.os }}
          path: |
            AB-Video-Processor-Windows.zip
            AB-Video-Processor-${{ matrix.os }}.dmg
          if-no-files-found: error
